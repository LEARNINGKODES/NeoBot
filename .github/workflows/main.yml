name: Build Geode Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Geode SDK
      run: | 
        mkdir -p $HOME/.geode-sdk
        curl -L https://github.com/geode-sdk/geode/releases/download/v2.0.0-beta.1/geode-sdk-v2.0.0-beta.1-linux.zip -o $HOME/.geode-sdk/geode-sdk.zip
        unzip $HOME/.geode-sdk/geode-sdk.zip -d $HOME/.geode-sdk
        echo "$HOME/.geode-sdk/bin" >> $GITHUB_PATH

    - name: Install Android NDK
      run: | 
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        sdkmanager --install "ndk;25.2.9519653" --sdk_root=$HOME/android-sdk
        echo "$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_PATH

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -G "Unix Makefiles"

    - name: Build for Android
      run: geode build --platform android

    - name: Upload Geode Mod
      uses: actions/upload-artifact@v4
      with:
        name: NeoBot-Android
        path: build/*.geode
